name: Lint

on:
  push:
    branches: [Mastery]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  solhint:
    name: Solhint (Solidity linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Warn-only for now (doesn't fail CI). Remove "|| true" later to enforce.
      - name: Run solhint
        run: |
          npx --yes solhint@4.5.4 --version
          npx --yes solhint@4.5.4 "contracts/**/*.sol" || true
