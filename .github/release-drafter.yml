name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
categories:
  - title: 🚀 Features
    labels: [feature, enhancement]
  - title: 🐛 Fixes
    labels: [bug, fix]
  - title: 🔒 Security
    labels: [security]
  - title: 🧹 Maintenance
    labels: [chore, deps]
change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'
exclude-labels: [skip-changelog]
